<div class="lobby-container animate-fade-in">
  <div class="lobby-panel text-center">
    <h2 class="lobby-title">ARENA MULTIJUGADOR</h2>

    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

    <div *ngIf="!currentRoom">
      <div class="row-actions">
        <button class="btn btn-create-room w-100" (click)="createRoom()" [disabled]="loading">
          ⚔️ CREAR NUEVA SALA
        </button>
      </div>

      <div class="divider"><span>O</span></div>

      <div class="join-room-section">
        <h3>Unirse a una Sala</h3>
        <div class="d-flex gap-3 mt-3">
          <input type="text" class="form-control code-input" placeholder="CÓDIGO" [(ngModel)]="roomCodeToJoin">
          <button class="btn btn-join" (click)="joinRoom()">ENTRAR</button>
        </div>
        <div class="alert alert-danger mt-3" *ngIf="errorMessage">{{ errorMessage }}</div>
        
        <div class="mt-4 text-center fw-bold" style="font-size: 0.85rem; color: var(--success); letter-spacing: 1px;">
          <span class="spinner-grow spinner-grow-sm me-2" role="status" aria-hidden="true"></span>
          CONEXIÓN GLOBAL ESTABLECIDA
        </div>
      </div>
    </div>

    <div *ngIf="currentRoom && currentRoom.status === 'WAITING'" class="waiting-room">
      <h3 class="mb-3">Sala Creada</h3>
      <p>Comparte este código con tu oponente:</p>
      
      <div class="code-display mb-4" (click)="copyCode()">
        {{ currentRoom.room_code }}
      </div>
      
      <div class="spinner-container mb-4">
        <div class="spinner"></div>
        <p class="mt-2 text-muted">Esperando a que el oponente se una...</p>
      </div>

      <button class="btn btn-danger" (click)="cancelRoom()">Cancelar Sala</button>
    </div>

  </div>
</div>
