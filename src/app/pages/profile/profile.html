<div class="container mt-5">
  <div class="glass-panel mx-auto text-center" style="max-width: 500px;" *ngIf="user">
    <div class="avatar-large mx-auto mb-3 d-flex justify-content-center align-items-center" style="font-size: 4rem; background: var(--surface-light); border-radius: 50%; width: 100px; height: 100px;">
      <span *ngIf="!user.avatarUrl">👤</span>
      <img *ngIf="user.avatarUrl" [src]="user.avatarUrl" alt="Avatar" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
    </div>
    
    <h2 class="mb-1">{{ user.username }}</h2>
    <p class="text-muted mb-4">{{ user.email }}</p>

    <div class="profile-stats mb-4">
      <div class="stat-item">
        <h4>{{ userStats.wins }}</h4>
        <small>Victorias</small>
      </div>
      <div class="stat-item">
        <h4>{{ userStats.losses }}</h4>
        <small>Derrotas</small>
      </div>
      <div class="stat-item">
        <h4>{{ userStats.total_matches }}</h4>
        <small>Partidas</small>
      </div>
    </div>

    <button class="btn btn-danger w-100" (click)="logout()">Cerrar Sesión</button>
  </div>
</div>
