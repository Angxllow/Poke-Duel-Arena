<div class="container auth-container">
  <div class="glass-panel auth-panel">
    <h2 class="auth-title">INICIAR SESIÓN</h2>
    
    <div class="alert alert-danger error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="alert alert-success success-message" *ngIf="successMessage">{{ successMessage }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control" name="email" [(ngModel)]="email" required placeholder="tu@email.com">
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">
        <span *ngIf="!isLoading">Entrar al Arena</span>
        <span *ngIf="isLoading">Verificando...</span>
      </button>
    </form>

    <div class="text-center mt-4 text-muted" style="font-size: 0.9rem;">
      ¿Nuevo retador? <a routerLink="/register" class="auth-link">Regístrate aquí</a>
    </div>
  </div>
</div>
