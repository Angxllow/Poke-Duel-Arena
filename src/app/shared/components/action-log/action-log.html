<div class="log-container animate-fade-in">
  <div class="log-header">
    <span class="icon">📜</span> REGISTRO DE BATALLA
  </div>
  <div class="log-list" #scrollContainer>
    <div class="log-entry animate-slide-in" *ngFor="let log of logs" [ngClass]="'entry-' + log.type.toLowerCase()">
      <div class="log-time">{{ log.createdAt | date:'HH:mm:ss' }}</div>
      <div class="log-content">
        <span class="log-badge" [ngClass]="'badge-' + log.type.toLowerCase()"></span>
        <span class="log-message" [innerHTML]="formatMessage(log)"></span>
      </div>
    </div>
  </div>
</div>
