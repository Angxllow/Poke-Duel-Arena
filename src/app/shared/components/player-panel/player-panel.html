<div class="panel-container" [class.opponent]="isOpponent" [class.active-turn]="isActiveTurn">
  <div class="player-info">
    <div class="avatar d-flex justify-content-center align-items-center" style="font-size: 2rem;">
      <span *ngIf="isOpponent">🤖</span>
      <span *ngIf="!isOpponent">👤</span>
    </div>
    <div class="details">
      <div class="username">{{ username }}</div>
      <div class="hp-bar-container">
        <div class="hp-bar life-fill" [ngClass]="getLifeBarClass()" [style.width.%]="getLifePercent()"></div>
        <div class="hp-text">{{ getDisplayedLife() }} / {{ maxLifePoints || 500 }} LP</div>
      </div>
    </div>
  </div>
  
  <div class="deck-info">
    <div class="deck-stat">
      <span class="label">Mazo:</span>
      <span class="value">{{ deckCount }}</span>
    </div>
    <div class="deck-stat">
      <span class="label">Descarte:</span>
      <span class="value">{{ discardCount }}</span>
    </div>
  </div>
</div>
