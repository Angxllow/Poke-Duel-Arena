<nav class="navbar">
  <div class="navbar-container container">
    <a routerLink="/" class="navbar-brand">
      <div class="logo-icon"></div>
      <span>PokeDuel Arena</span>
    </a>
    
    <div class="navbar-links">
      <a routerLink="/menu" routerLinkActive="active" class="nav-link">Jugar</a>
      <a routerLink="/collection" routerLinkActive="active" class="nav-link">Colección</a>
      <a routerLink="/deck-builder" routerLinkActive="active" class="nav-link">Mazos</a>
      <a routerLink="/history" routerLinkActive="active" class="nav-link">Historial</a>
      <a routerLink="/rules" routerLinkActive="active" class="nav-link">Reglas</a>
    </div>

    <div class="navbar-actions">
      @if (authService.isAuthenticated) {
        <a routerLink="/profile" class="nav-link user-greeting" style="margin-right: 1rem; color: var(--accent-color);">
          {{ authService.currentProfile?.username || authService.currentUser?.email }}
        </a>
        <button (click)="logout()" class="btn btn-outline btn-sm">Cerrar sesión</button>
      } @else {
        <a routerLink="/login" class="btn btn-outline btn-sm">Ingresar</a>
        <a routerLink="/register" class="btn btn-primary btn-sm">Registro</a>
      }
    </div>
  </div>
</nav>
